app = 'domestique-redis'
primary_region = 'iad'

[build]
  image = 'redis:7-alpine'

[processes]
  # volatile-lru: under memory pressure, evict only keys with a TTL (caches).
  # The Whoop refresh token has no TTL and must never be evicted — losing it
  # forces an interactive re-auth (`npm run whoop:auth`).
  app = "redis-server --dir /data --save 60 1 --appendonly no --maxmemory 64mb --maxmemory-policy volatile-lru"

[mounts]
  source = "redis_data"
  destination = "/data"

[[services]]
  protocol = 'tcp'
  internal_port = 6379
  # Domestique reaches Redis via domestique-redis.internal, which bypasses the
  # Fly Proxy, so a stopped machine is never woken and DNS won't resolve.
  # Keep it running.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 6379

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '256mb'
